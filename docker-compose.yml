# Local MongoDB as a single-node replica set.
#
# A replica set is not optional: multi-document transactions (checkout,
# payment fulfilment, quote acceptance) cannot start on a standalone mongod.
#
#   npm run db:up      start
#   npm run db:down    stop, keep data
#   npm run db:reset   stop and wipe
services:
  mongo:
    image: mongo:8
    container_name: innovatrix-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once a
      # primary has been elected.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data:
