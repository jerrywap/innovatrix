name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first. Without this a busy branch
# queues runs that are already answering an out-of-date question.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job needs a bootable environment: `src/config/env.ts` validates at
  # module load and names what is missing. These are **fixtures, not secrets** —
  # obviously fake values that satisfy the schema's shape.
  #
  # No real key reaches CI. §97 is explicit, and the tests are built for it: the
  # AI client is never called, payment providers are exercised through recorded
  # signatures, and storage is only reached by tests that skip without it.
  APP_URL: http://localhost:3000
  MONGODB_URI: mongodb://localhost:27017/innovatrix?replicaSet=rs0
  AUTH_SECRET: ci-secret-that-is-at-least-thirty-two-chars
  STORAGE_BUCKET: innovatrix-ci
  STORAGE_ACCESS_KEY_ID: ci
  STORAGE_SECRET_ACCESS_KEY: ci
  ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_NAME: Innovatrix

jobs:
  # ── the fast gate ──────────────────────────────────────────
  # Lint, types and 709 unit tests in about a minute. Everything below is
  # slower, so failing here first is the difference between a two-minute answer
  # and a ten-minute one.
  check:
    name: Lint · types · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  # ── the slow gate ──────────────────────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `mongodb-memory-server` downloads a mongod on first use. Without this
      # cache every PR pays for that download before a single test runs.
      #
      # No service container: the suite starts its own single-node replica set
      # (`src/test/mongo-setup.ts`), and a `services:` mongo would be a
      # standalone — which cannot run the transactions half these tests exist
      # to verify.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci
      - run: npm run test:integration

  # ── the artefact, and what must not be in it ───────────────
  build:
    name: Build · secret scan
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Keyed on the lockfile and the source: a source change should reuse
          # the dependency-level cache rather than start cold.
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - run: npm ci
      - run: npm run build

      # §88. Reads the built bundle rather than reasoning about the code —
      # `server-only` catches the honest mistake upstream, and the artefact is
      # the only thing that actually ships. Runs against the fake env above, so
      # the literal pass has values to look for.
      - run: npm run scan:bundle

  # ── dependencies ───────────────────────────────────────────
  # Separate and non-blocking on `check`, because a new advisory is not a
  # reason a correct PR cannot merge — it is a reason somebody has to look. The
  # gate is `high`; moderate findings are reported and do not fail.
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:deps

