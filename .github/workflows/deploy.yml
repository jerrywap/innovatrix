name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    # Deploy only when CI completed successfully.
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -s" <<'EOF'
            set -euo pipefail

            cd /home/cosetup/htdocs/cosetup.net

            # Find pm2 before touching anything, so a shell that cannot see it
            # fails with the server untouched rather than half-deployed. Not
            # hypothetical: the first green CI reached here, got through
            # `git reset --hard`, `npm ci` and `npm run build`, then died on
            # `pm2: command not found` — leaving new code and a new `.next` on
            # disk with the old process still serving it.
            #
            # `ssh host "bash -s"` is neither a login nor an interactive shell,
            # so no profile is read, and Ubuntu's ~/.bashrc — where nvm appends
            # its snippet — returns early when non-interactive. `node` and `npm`
            # resolve here anyway because they sit on the default PATH; pm2 does
            # not. So source nvm explicitly, then fall back to the usual places.
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              # nvm.sh reads unset variables of its own, which `set -u` treats
              # as fatal.
              set +u
              . "$NVM_DIR/nvm.sh" > /dev/null
              set -u
            fi

            PM2="$(command -v pm2 || true)"
            if [ -z "$PM2" ]; then
              for candidate in "$HOME"/.nvm/versions/node/*/bin/pm2 \
                               "$(npm prefix -g 2> /dev/null)/bin/pm2" \
                               /usr/local/bin/pm2 \
                               /usr/bin/pm2; do
                if [ -x "$candidate" ]; then
                  PM2="$candidate"
                  break
                fi
              done
            fi

            if [ -z "$PM2" ]; then
              echo "pm2 not found — nothing has been deployed." >&2
              echo "PATH=$PATH" >&2
              exit 1
            fi

            echo "==> Using pm2 at $PM2"
            echo "==> Deploying $DEPLOY_SHA"

            git fetch origin main
            git reset --hard "$DEPLOY_SHA"

            echo "==> Installing dependencies"
            npm ci

            echo "==> Building application"
            npm run build

            echo "==> Reloading application"
            "$PM2" reload cosetup --update-env

            echo "==> Saving PM2 process list"
            "$PM2" save

            echo "==> Waiting for application"
            sleep 5

            echo "==> Running health check"
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 3 \
              http://127.0.0.1:3000/ \
              > /dev/null

            echo "==> Deployment successful"
          EOF
