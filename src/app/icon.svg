<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.6 10 80 80" fill="none" stroke-width="9.5" stroke-linecap="round">
  <!--
    The tab icon. A browser renders a favicon against its own chrome, not against
    the page, so the near-black mark would vanish in a dark tab strip — hence the
    media query rather than one fixed ink. Chrome and Firefox both honour
    prefers-color-scheme inside an SVG favicon; one that does not falls back to
    the light ink, which is the safer of the two to be wrong about.
  -->
  <style>
    .ink { stroke: #14130f }
    .tip { stroke: #e0521f }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f4f1ea }
      .tip { stroke: #ff6a3d }
    }
  </style>
  <path class="ink" d="M70.26 27.25A34 34 0 1 0 62 79.44"/>
  <path class="ink" d="M61.8 39.2A10.8 10.8 0 1 0 51 50a10.8 10.8 0 1 1-10.8 10.8"/>
  <path class="tip" d="M28 20.56A34 34 0 0 1 70.26 27.25"/>
</svg>
